<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>Wordtrail</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 16px;
			}
			label,
			h2 {
				display: block;
				font-weight: normal;
				font-size: 0.8rem;
				color: GrayText;
				margin-top: 12px;
			}
			input,
			textarea {
				box-sizing: border-box;
				width: 100%;
				font: inherit;
			}
			#word {
				font-size: 1.5rem;
			}
			nav {
				text-align: right;
			}
			#words details {
				margin: 8px 0;
			}
			#words summary {
				cursor: pointer;
				font-size: 1.1rem;
			}
			.meanings {
				white-space: pre-line;
			}
			#url {
				color: GrayText;
				font-size: 0.8rem;
				overflow-wrap: anywhere;
			}
		</style>
	</head>
	<body>
		<nav><button id="toggle-list" type="button">一覧</button></nav>
		<main id="editor">
		<label for="word">見出し語</label>
		<input id="word" placeholder="単語をダブルクリックしてください" />
		<label for="meanings">意味（「verb:」のような行が品詞、その下の行が意味）</label>
		<textarea id="meanings" rows="10"></textarea>
		<label for="sentence">文脈</label>
		<p id="sentence"></p>
		<p id="url"></p>
		<section id="history" hidden>
			<h2>これまでの文脈</h2>
			<ol id="contexts"></ol>
		</section>
		<button id="save" type="button" disabled>保存</button>
		<span id="status" role="status"></span>
		</main>
		<section id="list" hidden>
			<p>
				<button id="export" type="button">書き出し</button>
				<button id="import" type="button">読み込み</button>
				<input id="import-file" type="file" accept=".json,application/json" hidden />
				<span id="list-status" role="status"></span>
			</p>
			<h2>登録した単語（新しい順）</h2>
			<p id="empty">まだ単語がありません。</p>
			<ol id="words"></ol>
		</section>
		<script type="module" src="panel.js"></script>
	</body>
</html>
