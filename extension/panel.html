<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>Wordtrail</title>
		<style>
			:root {
				color-scheme: light dark;
				--bg: #f7f6f2;
				--surface: #ffffff;
				--text: #2c2c2a;
				--muted: #6b6a65;
				--border: #dddbd3;
				--accent: #ae82d9;
				--tag-bg: #efe6f9;
				--tag-text: #4b2a73;
				--success: #1f6f68;
				--warning: #b42318;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1f1f1e;
					--surface: #2a2a28;
					--text: #ecebe6;
					--muted: #a5a39b;
					--border: #44443f;
					--accent: #c9a8ec;
					--tag-bg: #3d2a55;
					--tag-text: #e2d1f5;
					--success: #7fd6cc;
					--warning: #f97066;
				}
			}
			body {
				background: var(--bg);
				color: var(--text);
				font-family: system-ui, sans-serif;
				font-size: 14px;
				line-height: 1.6;
				margin: 0;
				padding: 12px 16px 24px;
			}
			nav {
				display: flex;
				justify-content: flex-end;
			}
			button {
				font: inherit;
				font-size: 13px;
				color: var(--text);
				background: transparent;
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 4px 12px;
				cursor: pointer;
			}
			button:hover {
				border-color: var(--muted);
			}
			#save {
				background: var(--accent);
				border-color: var(--accent);
				/* White on the lavender is 3:1, too faint for the main button. */
				color: #1f1f1e;
				padding: 6px 20px;
			}
			#save:disabled {
				opacity: 0.5;
				cursor: default;
			}
			.section {
				margin-top: 16px;
			}
			.tag,
			h2 {
				display: inline-block;
				font-size: 11px;
				font-weight: 500;
				background: var(--tag-bg);
				color: var(--tag-text);
				padding: 1px 8px;
				border-radius: 6px;
				margin: 0 0 6px;
			}
			.visually-hidden {
				position: absolute;
				width: 1px;
				height: 1px;
				overflow: hidden;
				clip-path: inset(50%);
			}
			#word {
				box-sizing: border-box;
				width: 100%;
				min-width: 0;
				font: inherit;
				font-size: 1.6rem;
				font-weight: 500;
				color: var(--text);
				background: transparent;
				border: none;
				border-bottom: 1px solid transparent;
				padding: 4px 0;
			}
			#word:focus {
				outline: none;
				border-bottom-color: var(--accent);
			}
			textarea {
				box-sizing: border-box;
				width: 100%;
				font: inherit;
				color: var(--text);
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 6px;
				padding: 8px;
				resize: vertical;
			}
			textarea:focus {
				outline: none;
				border-color: var(--accent);
			}
			.quote,
			.entry-contexts li {
				border-left: 3px solid var(--accent);
				padding-left: 10px;
				margin: 0 0 10px;
			}
			.quote p {
				margin: 0;
			}
			.headword {
				display: flex;
				align-items: center;
				gap: 8px;
			}
			.speak {
				font-size: 11px;
				color: var(--muted);
				padding: 0 6px;
				vertical-align: middle;
			}
			#url,
			.entry-contexts small {
				display: block;
				color: var(--muted);
				font-size: 11px;
				overflow-wrap: anywhere;
			}
			a {
				color: inherit;
			}
			#status.warning,
			#unsaved {
				color: var(--warning);
			}
			#list-status.success {
				color: var(--success);
				font-weight: 500;
			}
			.entry-contexts {
				list-style: none;
				padding: 0;
				margin: 0;
			}
			.actions {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: 20px;
			}
			#status,
			#list-status,
			#eijiro-status {
				font-size: 12px;
				color: var(--muted);
			}
			#words {
				list-style: none;
				padding: 0;
				margin: 0;
			}
			#words > li {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: 8px;
				padding: 8px 12px;
				margin-bottom: 8px;
			}
			#words > li {
				display: flex;
				align-items: center;
				gap: 8px;
				cursor: pointer;
			}
			#words .open {
				border: none;
				padding: 0;
				font-size: 1.05rem;
				font-weight: 500;
			}
			#words .count {
				margin-left: auto;
				font-size: 12px;
				color: var(--muted);
			}
			#delete {
				margin-left: auto;
			}
			#eijiro-section summary {
				cursor: pointer;
			}
			#eijiro-section summary::before {
				content: "▼ ";
			}
			#eijiro-section:not([open]) summary::before {
				content: "▶ ";
			}
			#eijiro-section:not([open]) summary::after {
				content: "畳んでいます（クリックで開く）";
				margin-left: 8px;
			}
			#toggle-list:disabled {
				opacity: 0.5;
				cursor: default;
			}
			.meanings,
			.note {
				white-space: pre-line;
				margin: 0 0 8px;
			}
			.muted {
				color: var(--muted);
			}
			#empty {
				color: var(--muted);
			}
		</style>
	</head>
	<body>
		<nav><button id="toggle-list" type="button">一覧</button></nav>
		<main id="editor">
			<label for="word" class="visually-hidden">見出し語</label>
			<div class="headword">
				<input id="word" placeholder="単語をダブルクリックしてください" />
				<button id="speak-word" class="speak" type="button" aria-label="見出し語を読み上げる" title="見出し語を読み上げる">▶</button>
			</div>
			<details id="eijiro-section" class="section" hidden open>
				<summary class="tag">英辞郎</summary>
				<p id="translations" class="meanings" aria-live="polite"></p>
			</details>
			<div class="section">
				<span class="tag">Wiktionary</span>
				<p id="meanings" class="meanings" aria-live="polite"></p>
			</div>
			<div class="section">
				<label for="note" class="tag">メモ</label>
				<textarea id="note" rows="4" placeholder="訳、覚え方、気づいたことなど"></textarea>
			</div>
			<div id="current" class="section">
				<span class="tag">文脈</span>
				<div class="quote">
					<p>
						<span id="sentence"></span>
						<button id="speak-sentence" class="speak" type="button" aria-label="文を読み上げる" title="文を読み上げる">▶</button>
					</p>
					<span id="url"></span>
				</div>
			</div>
			<section id="history" class="section" hidden>
				<h2>これまでの文脈</h2>
				<ol id="contexts" class="entry-contexts"></ol>
			</section>
			<div class="actions">
				<button id="save" type="button" disabled>保存</button>
				<span id="unsaved" hidden>未保存</span>
				<span id="status" role="status"></span>
				<button id="delete" type="button" hidden>削除</button>
			</div>
		</main>
		<section id="list" hidden>
			<div class="actions">
				<button id="export" type="button">書き出し</button>
				<button id="import" type="button">読み込み</button>
				<input id="import-file" type="file" accept=".json,application/json" hidden />
				<span id="list-status" role="status"></span>
			</div>
			<div class="actions">
				<button id="eijiro" type="button">英辞郎を取り込む</button>
				<input id="eijiro-file" type="file" accept=".txt,text/plain" hidden />
				<span id="eijiro-status" role="status"></span>
			</div>
			<div class="section">
				<h2>登録した単語（新しい順）</h2>
				<p id="empty">まだ単語がありません。</p>
				<ol id="words"></ol>
			</div>
		</section>
		<script type="module" src="panel.js"></script>
	</body>
</html>
