<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>Wordtrail</title>
		<style>
			body {
				font-family: system-ui, sans-serif;
				margin: 16px;
			}
			label {
				display: block;
				font-size: 0.8rem;
				color: GrayText;
				margin-top: 12px;
			}
			input,
			textarea {
				box-sizing: border-box;
				width: 100%;
				font: inherit;
			}
			#word {
				font-size: 1.5rem;
			}
			#url {
				color: GrayText;
				font-size: 0.8rem;
				overflow-wrap: anywhere;
			}
		</style>
	</head>
	<body>
		<label for="word">見出し語</label>
		<input id="word" placeholder="単語をダブルクリックしてください" />
		<label for="meanings">意味（「verb:」のような行が品詞、その下の行が意味）</label>
		<textarea id="meanings" rows="10"></textarea>
		<label for="sentence">文脈</label>
		<p id="sentence"></p>
		<p id="url"></p>
		<button id="save" type="button" disabled>保存</button>
		<span id="status" role="status"></span>
		<script type="module" src="panel.js"></script>
	</body>
</html>
